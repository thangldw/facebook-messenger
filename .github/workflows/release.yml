name: Release

# Push a tag like v0.2.0 (matching package.json "version") to build installers
# on native runners and publish them as a GitHub Release with SHA256SUMS.txt
# and build provenance attestations. After publishing, the Homebrew cask is
# updated, and every install path (install.sh, install.ps1 on x64 and ARM,
# brew, apt) is exercised against the real release.
# Manual runs build and smoke-test the installers as workflow artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build: npx electron-builder --mac --publish never
            files: |
              dist/*.dmg
              dist/*.zip
          - os: windows-latest
            build: npx electron-builder --win --x64 --publish never && npx electron-builder --win --arm64 --publish never
            files: |
              dist/*.exe
              dist/*.zip
          - os: ubuntu-latest
            build: npx electron-builder --linux --publish never
            files: |
              dist/*.AppImage
              dist/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      # No dependency cache in release builds: a poisoned cache must not reach a shipped binary.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Build
        shell: bash
        run: ${{ matrix.build }}

      - name: Smoke-test install.sh with the built zip
        if: runner.os == 'macOS'
        run: |
          zip=$(ls dist/*-mac-arm64.zip)
          MESSENGER_LITE_ZIP="$zip" MESSENGER_LITE_DIR="$RUNNER_TEMP/apps" MESSENGER_LITE_NO_OPEN=1 ./install.sh
          app="$RUNNER_TEMP/apps/Messenger Lite.app"
          codesign --verify --deep --strict "$app"
          npx --yes @electron/fuses read --app "$app" | tee fuses.txt
          grep -q "EnableCookieEncryption is Enabled" fuses.txt
          grep -q "RunAsNode is Disabled" fuses.txt

      - name: Smoke-test install.ps1 with the built zip (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:MESSENGER_LITE_ZIP = (Get-ChildItem dist\*-win-x64.zip).FullName
          $env:MESSENGER_LITE_DIR = Join-Path $env:RUNNER_TEMP 'apps\Messenger Lite'
          $env:MESSENGER_LITE_NO_OPEN = '1'
          .\install.ps1
          if (-not (Test-Path (Join-Path $env:MESSENGER_LITE_DIR 'Messenger Lite.exe'))) { throw 'exe missing after install' }
          if (-not (Test-Path (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Messenger Lite.lnk'))) { throw 'Start menu shortcut missing' }

      - name: Check the ARM64 build really is ARM64
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Get-ChildItem dist\*-win-arm64.zip).FullName)
          $s = $zip.GetEntry('Messenger Lite.exe').Open(); $b = New-Object byte[] 4096; [void]$s.Read($b, 0, 4096); $s.Close(); $zip.Dispose()
          $pe = [BitConverter]::ToInt32($b, 0x3c); $machine = [BitConverter]::ToUInt16($b, $pe + 4)
          if ($machine -ne 0xAA64) { throw ('ARM64 build has machine type 0x{0:X}' -f $machine) }

      - name: Generate and validate winget manifests
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $version = node -p "require('./package.json').version"
          Get-ChildItem dist\*-setup.exe | ForEach-Object { "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower(), $_.Name } | Set-Content -Encoding ascii setup-sums.txt
          node scripts/packaging.js winget $version setup-sums.txt winget-out
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            winget validate --manifest "winget-out\manifests\t\ThangLDW\MessengerLite\$version"
            if ($LASTEXITCODE -ne 0) { throw 'winget validate failed' }
          } else { Write-Warning 'winget is not available on this runner; manifests not validated' }
          Compress-Archive -Path winget-out\manifests -DestinationPath "dist\MessengerLite-$version-winget-manifests.zip"

      - name: Smoke-test the .deb (install, run, remove)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ./dist/*.deb xvfb
          test -x "/opt/Messenger Lite/messenger-lite"
          timeout 20 xvfb-run -a "/opt/Messenger Lite/messenger-lite" --no-sandbox --disable-gpu || [ $? -eq 124 ]
          sudo apt-get remove -y -qq messenger-lite

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS.txt
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS.txt
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Messenger Lite $GITHUB_REF_NAME" \
            --generate-notes

  # Points the Homebrew cask at the new release (the repo doubles as the tap).
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - name: Update Casks/messenger-lite.rb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP"
          node scripts/packaging.js cask "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/SHA256SUMS.txt"
          if git diff --quiet; then echo "Cask already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Homebrew cask: $GITHUB_REF_NAME"
          git push origin HEAD:main

  # Optional: submit the winget manifests to microsoft/winget-pkgs. Needs a
  # repository secret WINGET_TOKEN (a GitHub token with public_repo scope).
  winget:
    needs: release
    runs-on: windows-latest
    steps:
      - name: Submit to winget-pkgs
        shell: powershell
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not $env:WINGET_TOKEN) { Write-Host 'WINGET_TOKEN not set; skipping winget submission.'; exit 0 }
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          gh release download $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --pattern '*-winget-manifests.zip' --dir dl
          Expand-Archive dl\*.zip -DestinationPath wm
          Invoke-WebRequest -UseBasicParsing https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe submit --token $env:WINGET_TOKEN "wm\manifests\t\ThangLDW\MessengerLite\$version"

  verify-release:
    needs: [release, homebrew]
    uses: ./.github/workflows/verify-install.yml
    with:
      version: ${{ github.ref_name }}
