name: Release

# Push a tag like v0.1.0 (matching package.json "version") to build installers
# on native runners and publish them as a GitHub Release with SHA256SUMS.txt
# and build provenance attestations. After publishing, the install scripts are
# run against the real release on macOS and Windows.
# Manual runs build and smoke-test the installers as workflow artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
            files: |
              dist/*.dmg
              dist/*.zip
          - os: windows-latest
            target: --win
            files: |
              dist/*.exe
              dist/*.zip
          - os: ubuntu-latest
            target: --linux
            files: dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      # No dependency cache in release builds: a poisoned cache must not reach a shipped binary.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npx electron-builder ${{ matrix.target }} --publish never

      - name: Smoke-test install.sh with the built zip
        if: runner.os == 'macOS'
        run: |
          zip=$(ls dist/*-mac-arm64.zip)
          MESSENGER_LITE_ZIP="$zip" MESSENGER_LITE_DIR="$RUNNER_TEMP/apps" MESSENGER_LITE_NO_OPEN=1 ./install.sh
          app="$RUNNER_TEMP/apps/Messenger Lite.app"
          codesign --verify --deep --strict "$app"
          npx --yes @electron/fuses read --app "$app" | tee fuses.txt
          grep -q "EnableCookieEncryption is Enabled" fuses.txt
          grep -q "RunAsNode is Disabled" fuses.txt

      - name: Smoke-test install.ps1 with the built zip (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:MESSENGER_LITE_ZIP = (Get-ChildItem dist\*-win-x64.zip).FullName
          $env:MESSENGER_LITE_DIR = Join-Path $env:RUNNER_TEMP 'apps\Messenger Lite'
          $env:MESSENGER_LITE_NO_OPEN = '1'
          .\install.ps1
          if (-not (Test-Path (Join-Path $env:MESSENGER_LITE_DIR 'Messenger Lite.exe'))) { throw 'exe missing after install' }
          if (-not (Test-Path (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Messenger Lite.lnk'))) { throw 'Start menu shortcut missing' }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS.txt
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Messenger Lite $GITHUB_REF_NAME" \
            --generate-notes

  verify-release:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install from the published release (macOS)
        if: runner.os == 'macOS'
        env:
          MESSENGER_LITE_VERSION: ${{ github.ref_name }}
          MESSENGER_LITE_DIR: ${{ runner.temp }}/apps
          MESSENGER_LITE_NO_OPEN: "1"
        run: |
          ./install.sh
          codesign --verify --deep --strict "$MESSENGER_LITE_DIR/Messenger Lite.app"
      - name: Verify build provenance of a release asset
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*-mac-arm64.zip' --dir "$RUNNER_TEMP/dl"
          gh attestation verify "$RUNNER_TEMP"/dl/*-mac-arm64.zip --repo "$GITHUB_REPOSITORY"
      - name: Install from the published release (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          MESSENGER_LITE_VERSION: ${{ github.ref_name }}
          MESSENGER_LITE_NO_OPEN: "1"
        run: |
          $env:MESSENGER_LITE_DIR = Join-Path $env:RUNNER_TEMP 'apps\Messenger Lite'
          .\install.ps1
          if (-not (Test-Path (Join-Path $env:MESSENGER_LITE_DIR 'Messenger Lite.exe'))) { throw 'exe missing after install' }
