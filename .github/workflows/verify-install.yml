name: Verify install

# Installs a published release every supported way and checks the result:
# install.sh, Homebrew (macOS), install.ps1 on x64 and on a real Windows ARM
# runner, and apt (Ubuntu). Called by the release workflow after publishing;
# can also be run by hand for any release from the Actions tab.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to verify, e.g. v0.2.0
        type: string
        required: true

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, windows-11-arm, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check version format
        shell: bash
        run: '[[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Bad version $VERSION"; exit 1; }'

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.version }}
          persist-credentials: false

      - name: Install with install.sh
        if: runner.os == 'macOS'
        run: |
          export THRUM_VERSION="$VERSION" THRUM_DIR="$RUNNER_TEMP/apps" THRUM_NO_OPEN=1
          ./install.sh
          codesign --verify --deep --strict "$THRUM_DIR/Thrum.app"

      - name: Verify build provenance of a release asset
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern '*-mac-arm64.zip' --dir "$RUNNER_TEMP/dl"
          gh attestation verify "$RUNNER_TEMP"/dl/*-mac-arm64.zip --repo "$GITHUB_REPOSITORY"

      # Homebrew 6+ only loads casks from trusted taps; installing by the fully
      # qualified name trusts this cask, exactly as the README tells users to.
      - name: Install with Homebrew from the tap
        if: runner.os == 'macOS'
        run: |
          brew tap thangldw/thrum "https://github.com/$GITHUB_REPOSITORY"
          brew install --cask thangldw/thrum/thrum
          app="/Applications/Thrum.app"
          installed="$(defaults read "$app/Contents/Info.plist" CFBundleShortVersionString)"
          echo "Homebrew installed $installed"
          codesign --verify --deep --strict "$app"
          if xattr "$app" | grep -q com.apple.quarantine; then echo "::error::quarantine flag left on app"; exit 1; fi
          brew uninstall --cask thangldw/thrum/thrum

      - name: Install with install.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:THRUM_VERSION = $env:VERSION
          $env:THRUM_NO_OPEN = '1'
          $env:THRUM_DIR = Join-Path $env:RUNNER_TEMP 'apps\Thrum'
          .\install.ps1
          $exe = Join-Path $env:THRUM_DIR 'Thrum.exe'
          if (-not (Test-Path $exe)) { throw 'exe missing after install' }
          # On the ARM runner the installer must have picked the native ARM64 build.
          $fs = [IO.File]::OpenRead($exe); $b = New-Object byte[] 4096; [void]$fs.Read($b, 0, 4096); $fs.Close()
          $pe = [BitConverter]::ToInt32($b, 0x3c)
          $machine = [BitConverter]::ToUInt16($b, $pe + 4)
          $expected = if ($env:RUNNER_ARCH -eq 'ARM64') { 0xAA64 } else { 0x8664 }
          if ($machine -ne $expected) { throw ('Installed exe has machine type 0x{0:X}, expected 0x{1:X}' -f $machine, $expected) }

      - name: Install the .deb with apt
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/dl"
          (cd "$RUNNER_TEMP/dl" && sha256sum -c --ignore-missing SHA256SUMS.txt)
          sudo apt-get install -y -qq "$RUNNER_TEMP"/dl/*.deb
          test -x "/opt/Thrum/thrum"
