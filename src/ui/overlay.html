<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thrum</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <main id="card" class="card" aria-live="polite">
    <svg class="logo" viewBox="160 230 700 640" aria-hidden="true">
      <path d="M332 286h360c66 0 120 54 120 120v188c0 66-54 120-120 120H452l-112 86c-13 10-32 1-32-15v-77c-57-9-96-58-96-114V406c0-66 54-120 120-120z"/>
      <path d="M330 500h92l46-84 76 168 46-84h104"/>
    </svg>

    <section data-mode="lock" hidden>
      <h1>Thrum is locked</h1>
      <form id="unlock-form" autocomplete="off">
        <label class="sr" for="unlock-password">Password</label>
        <input id="unlock-password" type="password" placeholder="Password" maxlength="256" autocomplete="current-password" required>
        <button type="submit" class="primary">Unlock</button>
      </form>
      <button id="touchid" type="button" class="secondary" hidden>Use Touch ID</button>
      <p class="error" id="unlock-error" role="alert"></p>
      <button id="forgot" type="button" class="link">Forgot password? Log out and reset…</button>
    </section>

    <section data-mode="setup" hidden>
      <h1>Set an app password</h1>
      <p class="muted">You'll need it to open Thrum. It is stored only as a salted hash on this computer.</p>
      <form id="setup-form" autocomplete="off">
        <label class="sr" for="setup-password">New password</label>
        <input id="setup-password" type="password" placeholder="New password (6+ characters)" minlength="6" maxlength="256" autocomplete="new-password" required>
        <label class="sr" for="setup-confirm">Confirm password</label>
        <input id="setup-confirm" type="password" placeholder="Confirm password" minlength="6" maxlength="256" autocomplete="new-password" required>
        <div class="row">
          <button type="button" id="setup-cancel" class="secondary">Cancel</button>
          <button type="submit" class="primary">Turn on lock</button>
        </div>
      </form>
      <p class="error" id="setup-error" role="alert"></p>
    </section>

    <section data-mode="offline" hidden>
      <h1>Can't reach Facebook</h1>
      <p class="muted">Check your internet connection. Thrum will reconnect automatically.</p>
      <p class="status"><span class="spinner" aria-hidden="true"></span><span id="offline-status">Retrying…</span></p>
      <button id="offline-retry" type="button" class="primary">Try now</button>
    </section>

    <section data-mode="crashed" hidden>
      <h1>Something went wrong</h1>
      <p class="muted">The page stopped responding several times in a row.</p>
      <button id="crashed-retry" type="button" class="primary">Reload</button>
    </section>
  </main>
  <script src="overlay.js"></script>
</body>
</html>
